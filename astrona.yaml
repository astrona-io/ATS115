      - type: reading
        title: Question
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Move Auditing Into The Server Configuration Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: audit
        task_kind: migration
        tags: [declarative-audit, file-audit, audit-device, audit-hash, helm-values]
        learning_goals:
          - Move an API-created audit device into an audit stanza in the server configuration
