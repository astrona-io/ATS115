        difficulty: intermediate
        estimated_duration: 20m
        topic: audit
        task_kind: build
        tags: [audit-device, file-audit, socket-audit, audit-hash]
        learning_goals:
          - Enable a file audit device on the audit volume and a socket device to a TCP listener
