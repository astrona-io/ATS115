          - Prove that the declared device records requests after a restart and an unseal
        resources:
          - name: "Declarative audit devices"
            url: https://openbao.org/docs/configuration/audit/
          - name: "Server configuration"
            url: https://openbao.org/docs/configuration/
          - name: "Audit devices"
            url: https://openbao.org/docs/audit/
