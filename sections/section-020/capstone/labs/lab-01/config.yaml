# Make Payroll Reads Need An Approval
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-capstone-020-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-approval-flow"
      description: "Runs the control group flow: dave requests, carol approves, dave unwraps"
      type: "file"
      source: "validation/validate-approval-flow.sh"
    - name: "validate-only-payroll"
      description: "Confirms alice, who is in staff but not payroll, cannot even request"
      type: "file"
      source: "validation/validate-only-payroll.sh"
    - name: "validate-groups-kept"
      description: "Confirms the groups were changed, not deleted and created again"
      type: "file"
      source: "validation/validate-groups-kept.sh"

teardown:
  keepCluster: false
