# Contain A Leaked Credential
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-lab-030-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-billing-revoked"
      description: "Confirms the billing token, its child token and both certificate leases are invalid"
      type: "file"
      source: "validation/validate-billing-revoked.sh"
    - name: "validate-secret-id-destroyed"
      description: "Confirms the leaked secret ID is destroyed and the role billing remains"
      type: "file"
      source: "validation/validate-secret-id-destroyed.sh"
    - name: "validate-inventory-untouched"
      description: "Confirms the inventory token, certificate lease and secret ID are untouched"
      type: "file"
      source: "validation/validate-inventory-untouched.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
