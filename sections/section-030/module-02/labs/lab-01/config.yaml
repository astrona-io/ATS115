# Make The Worker Role Strict
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-lab-030-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-role-settings"
      description: "Confirms the role worker allows only worker-read and creates periodic, renewable orphan tokens"
      type: "file"
      source: "validation/validate-role-settings.sh"
    - name: "validate-spawner-tokens"
      description: "Confirms a spawner token creates only periodic orphan worker tokens through the role"
      type: "file"
      source: "validation/validate-spawner-tokens.sh"
    - name: "validate-policies-unchanged"
      description: "Confirms the policies worker-spawner and admin-ops are unchanged"
      type: "file"
      source: "validation/validate-policies-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
