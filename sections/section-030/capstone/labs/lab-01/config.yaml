# Contain A Leaked Token Tree
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-tree-revoked"
      description: "Confirms ci-parent, its child build-1 and build-1's leases are gone"
      type: "file"
      source: "validation/validate-tree-revoked.sh"
    - name: "validate-orphan-kept"
      description: "Confirms the orphan release-bot and its lease still work"
      type: "file"
      source: "validation/validate-orphan-kept.sh"
    - name: "validate-wrapping-required"
      description: "Confirms secret-id-issuer forces a wrapped response of at most 5 minutes"
      type: "file"
      source: "validation/validate-wrapping-required.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
