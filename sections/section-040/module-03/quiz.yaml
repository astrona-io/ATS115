# Knowledge check for module 03 of section 040. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats115-040-03
course_id: ATS115
exam_code: OPENBAO
status: alpha
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: module
  id: "section-040/module-03"
  title: "Investigate Incidents With The Audit Log"
placement:
  position: after
  reading: sections/section-040/module-03/course-05-summary.md
questions:
  - id: ats115-040-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Count requests correctly"
    source_readings:
      - sections/section-040/module-03/course-01-reading-an-audit-record.md
    prompt: "How many lines does one request write to the audit log?"
    options:
      - id: a
        text: "One."
        explanation: "Not correct. There are two entries."
      - id: b
        text: "Two: a request entry and a response entry."
        explanation: "Correct. Filter on `type` before you count."
      - id: c
        text: "Three."
        explanation: "Not correct. There are two."
    correct_option: b
    explanation: "Correct. Filter on `type` before you count."

  - id: ats115-040-03-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Search for KV version 2 paths"
    source_readings:
      - sections/section-040/module-03/course-01-reading-an-audit-record.md
    prompt: "How does a KV version 2 read of `secret/db` appear in the path field?"
    options:
      - id: a
        text: "As `secret/db`."
        explanation: "Not correct. The data segment is included."
      - id: b
        text: "As `secret/metadata/db`."
        explanation: "Not correct. That is a different path."
      - id: c
        text: "As `secret/data/db`."
        explanation: "Correct. KV version 2 inserts the `data` segment."
    correct_option: c
    explanation: "Correct. KV version 2 inserts the `data` segment."

  - id: ats115-040-03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand hashing in a search"
    source_readings:
      - sections/section-040/module-03/course-01-reading-an-audit-record.md
    prompt: "Can you read an unknown secret value from the audit log?"
    options:
      - id: a
        text: "No. Hashing prevents it, and it is meant to."
        explanation: "Correct. Only hashes are written."
      - id: b
        text: "Yes, for KV version 2."
        explanation: "Not correct. Hashing applies to all."
      - id: c
        text: "Yes, with the root token."
        explanation: "Not correct. The log is a file."
    correct_option: a
    explanation: "Correct. Only hashes are written."

  - id: ats115-040-03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Search for a known value"
    source_readings:
      - sections/section-040/module-03/course-02-finding-records-with-hashes-and-filters.md
    prompt: "How do you find where a known value appears in the log?"
    options:
      - id: a
        text: "Search for the clear text value."
        explanation: "Not correct. Values are hashed."
      - id: b
        text: "Hash it with the same device and search for the hash."
        explanation: "Correct. The device path matters."
      - id: c
        text: "Hash it with any device."
        explanation: "Not correct. Each device has its own salt."
    correct_option: b
    explanation: "Correct. The device path matters."

  - id: ats115-040-03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid double counting"
    source_readings:
      - sections/section-040/module-03/course-02-finding-records-with-hashes-and-filters.md
    prompt: "How do you count requests and not log entries?"
    options:
      - id: a
        text: "Divide the total by three."
        explanation: "Not correct. There are two entries."
      - id: b
        text: "Count unique paths."
        explanation: "Not correct. That is a different number."
      - id: c
        text: "Select `type==\"request\"` first."
        explanation: "Correct. That removes the response entries."
    correct_option: c
    explanation: "Correct. That removes the response entries."

  - id: ats115-040-03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prove who did it"
    source_readings:
      - sections/section-040/module-03/course-02-finding-records-with-hashes-and-filters.md
    prompt: "What is a firm identifier for a person in the log?"
    options:
      - id: a
        text: "The entity ID."
        explanation: "Correct. A display name is not proof."
      - id: b
        text: "The display name."
        explanation: "Not correct. Names can repeat or change."
      - id: c
        text: "The client IP."
        explanation: "Not correct. Addresses are shared."
    correct_option: a
    explanation: "Correct. A display name is not proof."

  - id: ats115-040-03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read response lines"
    source_readings:
      - sections/section-040/module-03/course-03-following-an-identity-through-the-log.md
    prompt: "Why read the response entry as well as the request entry?"
    options:
      - id: a
        text: "It holds the secret."
        explanation: "Not correct. Values are hashed."
      - id: b
        text: "It shows whether the request worked."
        explanation: "Correct. A request line alone does not show the result."
      - id: c
        text: "It is the only one with a time."
        explanation: "Not correct. Both have a time."
    correct_option: b
    explanation: "Correct. A request line alone does not show the result."

  - id: ats115-040-03-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Follow created tokens"
    source_readings:
      - sections/section-040/module-03/course-03-following-an-identity-through-the-log.md
    prompt: "An identity creates a token during the incident. How do you follow it?"
    options:
      - id: a
        text: "Ignore it, because it is a new identity."
        explanation: "Not correct. It is part of the trail."
      - id: b
        text: "Search for the token value."
        explanation: "Not correct. Values are hashed."
      - id: c
        text: "Follow the accessor hash of the token through the log."
        explanation: "Correct. Later tokens belong to the same chain."
    correct_option: c
    explanation: "Correct. Later tokens belong to the same chain."

  - id: ats115-040-03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle the evidence"
    source_readings:
      - sections/section-040/module-03/course-03-following-an-identity-through-the-log.md
    prompt: "How should you analyze the only copy of a log?"
    options:
      - id: a
        text: "Work on a copy with a checksum."
        explanation: "Correct. The original stays unchanged."
      - id: b
        text: "Edit it in place."
        explanation: "Not correct. That spoils evidence."
      - id: c
        text: "Delete the old part first."
        explanation: "Not correct. That removes evidence."
    correct_option: a
    explanation: "Correct. The original stays unchanged."

  - id: ats115-040-03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Build alerts"
    source_readings:
      - sections/section-040/module-03/course-04-patterns-worth-an-alert.md
    prompt: "What should you know before you set a count alert?"
    options:
      - id: a
        text: "The number of policies."
        explanation: "Not correct. It is unrelated."
      - id: b
        text: "The normal count."
        explanation: "Correct. A count means nothing without a baseline."
      - id: c
        text: "The token type."
        explanation: "Not correct. It is unrelated."
    correct_option: b
    explanation: "Correct. A count means nothing without a baseline."
