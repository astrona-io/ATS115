# Move Auditing Into The Server Configuration
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-capstone-040-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients) and the audit-sink listener."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-declarative"
      description: "Confirms the audit stanza is in the server configuration and API creation is off"
      type: "file"
      source: "validation/validate-declarative.sh"
    - name: "validate-device-list"
      description: "Confirms file-persistent/ is active and the old /tmp device is gone"
      type: "file"
      source: "validation/validate-device-list.sh"
    - name: "validate-records"
      description: "Writes a secret and finds its hash in /openbao/audit/audit.log"
      type: "file"
      source: "validation/validate-records.sh"
    - name: "validate-api-creation-refused"
      description: "Confirms creating an audit device through the API is refused now"
      type: "file"
      source: "validation/validate-api-creation-refused.sh"

teardown:
  keepCluster: false
