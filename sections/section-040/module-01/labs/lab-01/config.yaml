# Send Every Request To Two Audit Devices
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients) and the audit-sink listener."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-devices"
      description: "Confirms a file device at file/ and a socket device at socket/ with the given options"
      type: "file"
      source: "validation/validate-devices.sh"
    - name: "validate-file-records"
      description: "Writes a secret and finds its audit hash in the file device's log"
      type: "file"
      source: "validation/validate-file-records.sh"
    - name: "validate-socket-records"
      description: "Writes a secret and finds its audit hash in the socket listener's output"
      type: "file"
      source: "validation/validate-socket-records.sh"

teardown:
  keepCluster: false
