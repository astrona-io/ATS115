# Replace A Raw Debug Device
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-115-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm, bao, the tester pod and OpenBao v2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-115-lab-040-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients) and the audit-sink listener."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-device-options"
      description: "Confirms file/ is configured for production and debug/ is gone"
      type: "file"
      source: "validation/validate-device-options.sh"
    - name: "validate-raw-file-removed"
      description: "Confirms the raw debug file is removed from the audit volume"
      type: "file"
      source: "validation/validate-raw-file-removed.sh"
    - name: "validate-values-hashed"
      description: "Confirms the new log holds a new value only in hashed form"
      type: "file"
      source: "validation/validate-values-hashed.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine/socat:1.8.1.3
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
